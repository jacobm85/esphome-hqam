sensor:
  # Register 0x01EF: charged capacity, not battery level. Unverified.
  - platform: template
    id: batteryChargedSensor
    name: "Battery charged capacity"
    unit_of_measurement: mAh
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_battery_level_sensor()->state;
      if (std::isnan(v)) return {};
      return {v};

  - platform: template
    id: chargingTimeSensor
    name: "Charging time"
    unit_of_measurement: min
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      float v = mower->get_charging_time_sensor()->state;
      if (std::isnan(v)) return {};
      return {v};

  - platform: template
