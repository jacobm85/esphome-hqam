# Timer schedule as HH:MM time pickers. Each time is one 16-bit register at an
# even address (hour in the low byte, minute in the high byte):
#   timer 1 weekday start/stop 0x38/0x3A, weekend start/stop 0x3C/0x3E,
#   timer 2 weekday start/stop 0x40/0x42, weekend start/stop 0x44/0x46.
# Read addr = 0x4A00 | reg, write = 0xCA | reg.
datetime:
  - platform: template
    name: "Timer 1 weekday start"
    type: time
    id: timer1_weekday_start
    entity_category: config
    update_interval: 60s
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      return mower->get_timer_time(0x38);
    set_action:
      then:
        - lambda: |-
            esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
            mower->set_timer_time(0x38, x.hour, x.minute);

  - platform: template
    name: "Timer 1 weekday stop"
    type: time
    id: timer1_weekday_stop
    entity_category: config
    update_interval: 60s
    lambda: |-
