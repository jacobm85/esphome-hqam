# Timer schedule as HH:MM time pickers. Each entity reads two registers
# (hour + minute) and writes them back on change. Register low bytes:
#   weekday start/stop, weekend start/stop for timer 1 (0x38..0x3F)
#   and timer 2 (0x40..0x47). Read addr = 0x4A00 | reg, write = 0xCA | reg.
datetime:
  - platform: template
    name: "Timer 1 weekday start"
    type: time
    id: timer1_weekday_start
    entity_category: config
    update_interval: 60s
    lambda: |-
      esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
      return mower->get_timer_time(0x38, 0x39);
    set_action:
      then:
        - lambda: |-
            esphome::mower::Automower *mower = (esphome::mower::Automower *) id(mower_id);
            mower->set_timer_register(0x38, x.hour);
            mower->set_timer_register(0x39, x.minute);

  - platform: template
