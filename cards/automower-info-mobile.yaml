# Automower info card, compact (phone). Mode, status and battery on a
# small LCD in the control panel's style; a tap opens the Automower
# dashboard. Requires button-card. Paste as a card in any dashboard.
type: custom:button-card
entity: sensor.automower_current_mode
show_icon: false
show_name: false
show_state: false
tap_action:
  action: navigate
  navigation_path: /dashboard-automower/automower
grid_options:
  columns: 12
custom_fields:
  brand: HUSQVARNA
  more: AUTOMOWER ›
  lcd: >
    [[[
      var BATT_MAX = 2200;
      var ok = function (e) {
        return e && e.state !== undefined && e.state !== 'unknown'
          && e.state !== 'unavailable' && String(e.state).trim() !== '';
      };
      var md = states['sensor.automower_current_mode'];
      var st = states['sensor.automower_status'];
      var bu = states['sensor.automower_battery_used'];
      var mode = ok(md) ? md.state.toUpperCase() : '- - - -';
      var status = ok(st) ? st.state : '- - - -';
      var v = ok(bu) && !isNaN(bu.state) ? Number(bu.state) : NaN;
      var pct = isNaN(v) ? null : Math.min(100, Math.max(0, v / BATT_MAX * 100));
      return '<div style="background:repeating-linear-gradient(0deg,rgba(0,0,0,.055) 0 1px,transparent 1px 3px),'
        + 'radial-gradient(130% 150% at 50% 0%,#B7C65A 0%,#9FAF48 58%,#8A9A3C 100%);'
        + 'border:4px solid #14161A;border-radius:4px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4);'
        + 'padding:7px 10px;font-family:Roboto Mono,SF Mono,Consolas,monospace;color:#151F0B;'
        + 'display:flex;align-items:center;justify-content:space-between;gap:12px;">'
        + '<div style="min-width:0;text-align:left;">'
        + '<div style="font-size:20px;font-weight:700;letter-spacing:.1em;line-height:1.15;">' + mode + '</div>'
        + '<div style="font-size:11px;letter-spacing:.08em;color:#2C3A16;white-space:nowrap;'
        + 'overflow:hidden;text-overflow:ellipsis;">' + status + '</div></div>'
        + '<div style="flex:0 0 72px;text-align:right;">'
        + '<div style="font-size:16px;font-weight:700;line-height:1.15;">'
        + (pct === null ? '--%' : pct.toFixed(0) + '%') + '</div>'
        + '<div style="height:7px;border:1px solid #16200C;background:rgba(0,0,0,.08);margin-top:4px;">'
        + '<div style="height:100%;width:' + (pct || 0).toFixed(0) + '%;background:#16200C;"></div></div>'
        + '</div></div>';
    ]]]
styles:
  card:
    - background: 'linear-gradient(180deg, #35393C 0%, #242729 100%)'
    - border: '1px solid #16181A'
    - border-radius: 16px
    - padding: 8px 10px 10px 10px
    - box-shadow: '0 6px 16px rgba(0,0,0,.45)'
  grid:
    - grid-template-areas: '"brand more" "lcd lcd"'
    - grid-template-columns: 1fr auto
    - row-gap: 6px
  custom_fields:
    brand:
      - justify-self: start
      - color: '#FF5800'
      - font-size: 8px
      - font-weight: 700
      - letter-spacing: 0.34em
      - padding-left: 2px
    more:
      - justify-self: end
      - color: '#787E82'
      - font-size: 8px
      - letter-spacing: 0.16em
      - padding-right: 2px
    lcd:
      - justify-self: stretch
